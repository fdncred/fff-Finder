[workspace]
members = [".", "crates/fff-Finder-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Darren Schroeder"]

[workspace.dependencies]
fff-Finder-core = { path = "crates/fff-Finder-core" }
fff-search = "0.11.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"

[package]
name = "fff-Finder"
description = "A fast, cross-platform Finder-style file search app built on fff-search and GPUI Kit"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "fff_Finder"
path = "src/lib.rs"

[[bin]]
name = "fff-Finder"
path = "src/main.rs"

[dependencies]
fff-Finder-core.workspace = true
gpui-kit = "0.7.3"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
log.workspace = true
trash = "5"
# Hands control-socket requests to the UI thread.
async-channel = "2"
# Colors file names the way Nushell's `ls` does.
lscolors = { version = "0.21", default-features = false }

# Finder's own colors and icons, read from AppKit at run time.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = "limited"

[profile.release]
lto = "thin"
codegen-units = 16

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
fff-search = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
resvg = { opt-level = 3 }
image = { opt-level = 3 }
